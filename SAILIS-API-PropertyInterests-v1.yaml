  PropertyInterestSearchResult:
    type: object
    properties:
      propertyInterestId:
        type: integer
        format: int64
      propertyInterestParcelLinkId:
        type: integer
        format: int64
      propertyInterestName:
        type: string
        maxLength: 50
      propertyInterestCode:
        type: string
        maxLength: 6
      propertyInterestReference:
        type: string
        maxLength: 20
      planParcelReference:
        $ref: "#/definitions/PlanParcelReference"
      propertyAddress:
        $ref: "#/definitions/Address"
      titleReference:
        $ref: "#/definitions/TitleReference"
      valuationNumbers:
        type: array
        items:
          type: string
          minLength: 10
          maxLength: 10
      propertyInterestCreatedTime:
        type: string
        format: date-time
      parcelLinkCreatedTime:
        type: string
        format: date-time
      propertyInterestEffectiveFrom:
        type: string
        format: date-time
      propertyInterestEffectiveTo:
        type: string
        format: date-time
  PropertyInterestSearchResults:
    type: object
    properties:
      searchResults:
        type: array
        items:
          $ref: "#/definitions/PropertyInterestSearchResult"
  ApiError:
    type: object
    properties:
      httpStatus:
        $ref: "#/definitions/HttpStatusType"
      errorMessage:
        type: string
  ApiErrorWithId:
    type: object
    properties:
      httpStatus:
        $ref: "#/definitions/HttpStatusType"
      errorMessage:
        type: string
      errorId:
        type: integer
        format: int64
  HttpStatusType:
    type: object
    properties:
      httpStatus:
        type: string
        enum:
          - CONTINUE
          - SWITCHING_PROTOCOLS
          - PROCESSING
          - CHECKPOINT
          - OK
          - CREATED
          - ACCEPTED
          - NON_AUTHORITATIVE_INFORMATION
