          - G
          - L
          - LG
          - M
          - OD
          - P
          - PTHS
          - PLF
          - PDM
          - RT
          - SB
          - UG
      floorLevelNo:
        type: string
        maxLength: 5
      buildingName:
        type: string
        maxLength: 50
      lotNo:
        type: string
        maxLength: 6
      streetNo:
        type: string
        maxLength: 6
      streetNoTo:
        type: string
        maxLength: 6
      streetName:
        type: string
        maxLength: 45
      streetType:
        type: string
        enum:
          - ACCS
          - ALLY
          - ALWY
          - AMBL
          - APP
          - ARC
