swagger: "2.0"
info:
  description: APIs exposed to access SAILIS Property Interest Web Services
  version: v1
  title: SAILIS Property Interests Web Services
basePath: /api
schemes:
  - https
paths:
  /auth:
    post:
      summary: Authenticate
      consumes: ["application/x-www-form-urlencoded"]
      description: Authenticates a client and returns a Bearer JWT header.
      operationId: auth
      parameters:
        - name: username
          in: formData
          required: true
          type: string
        - name: password
          in: formData
          required: true
          type: string
      responses:
        204:
          description: Successfully authenticated
          headers:
            Authorization:
              type: string
              description: Bearer JWT
        400:
          description: Invalid credentials
          schema:
            $ref: "#/definitions/ApiError"
  /propertyinterest/v1/search/title:
    get:
      summary: Search for Property Interest using Title Reference
      operationId: propertyInterestTitleSearch
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: register
          in: query
          required: true
          type: string
          enum: [CT, CR, CL]
        - name: volume
          in: query
          required: true
          type: integer
          format: int32
          minimum: 5000
        - name: folio
          in: query
          required: true
          type: integer
          format: int32
          maximum: 999
        - name: pageNumber
          in: query
          description: "Page Number (1-based); defaults to 1"
          required: false
          type: integer
          format: int32
        - name: pageSize
          in: query
          description: "Page Size; defaults to 10"
          required: false
          type: integer
          format: int32
      responses:
        200:
          description: Successful Operation
          schema:
            type: "array"
            items:
              $ref: "#/definitions/PropertyInterestSearchResult"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/search/parcel:
    get:
      summary: Search for Property Interest using Plan/Parcel Reference
      operationId: propertyInterestPlanParcelSearch
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: parcelType
          in: query
          required: true
          type: string
          enum:
            - AL
            - AP
            - AR
            - AD
            - AE
            - AV
            - AT
            - AF
            - FL
            - FQ
            - ID
            - IQ
            - FC
            - UC
            - UN
            - SE
            - BL
            - TA
            - AC
            - QP
        - name: parcelNumber
          in: query
          required: true
          type: string
          maxLength: 6
        - name: planType
          in: query
          required: true
          type: string
          enum:
            - D
            - C
            - S
            - F
            - H
            - R
            - T
            - G
        - name: planNumber
          in: query
          required: true
          type: string
          maxLength: 6
        - name: pageNumber
          in: query
          description: "Page Number (1-based); defaults to 1"
          required: false
          type: integer
          format: int32
        - name: pageSize
          in: query
          description: "Page Size; defaults to 10"
          required: false
          type: integer
          format: int32
      responses:
        200:
          description: Successful Operation
          schema:
            type: "array"
            items:
              $ref: "#/definitions/PropertyInterestSearchResult"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/search/reference:
    get:
      summary: Search for Property Interest using Property Interest Reference
      operationId: propertyInterestReferenceSearch
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestReference
          in: query
          required: true
          type: string
          maxLength: 20
        - name: pageNumber
          in: query
          description: "Page Number (1-based); defaults to 1"
          required: false
          type: integer
          format: int32
        - name: pageSize
          in: query
          description: "Page Size; defaults to 10"
          required: false
          type: integer
          format: int32
      responses:
        200:
          description: successful operation
          schema:
            type: "array"
            items:
              $ref: "#/definitions/PropertyInterestSearchResult"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/search/name:
    get:
      summary: Search for Property Interest using Property Interest Name
      operationId: propertyInterestCodeSearch
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestName
          in: query
          required: false
          type: string
          maxLength: 50
        - name: propertyInterestCode
          in: query
          required: false
          type: string
          maxLength: 6
        - name: pageNumber
          in: query
          description: "Page Number (1-based); defaults to 1"
          required: false
          type: integer
          format: int32
        - name: pageSize
          in: query
          description: "Page Size; defaults to 10"
          required: false
          type: integer
          format: int32
      responses:
        200:
          description: successful operation
          schema:
            type: "array"
            items:
              $ref: "#/definitions/PropertyInterestSearchResult"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/create:
    post:
      summary: Create a Property Interest for Organisation
      consumes:
        - application/x-www-form-urlencoded
      operationId: propertyInterestCreate
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestName
          in: formData
          required: true
          type: string
          maxLength: 50
        - name: propertyInterestCode
          in: formData
          required: false
          type: string
          maxLength: 6
        - name: effectiveFromDate
          in: formData
          required: true
          type: string
          format: date-time
        - name: effectiveToDate
          in: formData
          required: false
          type: string
          format: date-time
      responses:
        200:
          description: Successful Operation
          schema:
            $ref: "#/definitions/PropertyInterest"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS Error: <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/link/parcel/{propertyInterestId}:
    post:
      summary: Link Property Interest to Parcel
      consumes:
        - application/x-www-form-urlencoded
      operationId: propertyInterestLinkParcel
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestId
          in: path
          required: true
          type: integer
          format: int64
        - name: propertyInterestReference
          in: formData
          required: true
          type: string
          maxLength: 20
        - name: parcelType
          in: formData
          required: true
          type: string
          enum:
            - AL
            - AP
            - AR
            - AD
            - AE
            - AV
            - AT
            - AF
            - FL
            - FQ
            - ID
            - IQ
            - FC
            - UC
            - UN
            - SE
            - BL
            - TA
            - AC
            - QP
        - name: parcelNumber
          in: formData
          required: true
          type: string
          maxLength: 6
        - name: planType
          in: formData
          required: true
          type: string
          enum:
            - D
            - C
            - S
            - F
            - H
            - R
            - T
            - G
        - name: planNumber
          in: formData
          required: true
          type: string
          maxLength: 6
      responses:
        201:
          description: successful operation
          schema:
            $ref: "#/definitions/PropertyInterestParcel"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/link/title/{propertyInterestId}:
    post:
      summary: Link Property Interest to all Parcels contained within a Title
      consumes:
        - application/x-www-form-urlencoded
      operationId: propertyInterestLinkTitle
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestId
          in: path
          required: true
          type: integer
          format: int64
        - name: register
          in: formData
          required: true
          type: string
          enum: [CT, CR, CL]
        - name: volume
          in: formData
          required: true
          type: integer
          format: int32
          minimum: 5000
        - name: folio
          in: formData
          required: true
          type: integer
          format: int32
          maximum: 999
        - name: propertyInterestReference
          in: formData
          required: true
          type: string
          maxLength: 20
      responses:
        201:
          description: successful operation
          schema:
            type: object
            properties:
              propertyInterestParcelList:
                type: array
                items:
                  $ref: "#/definitions/PropertyInterestParcel"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/edit/parcel/{propertyInterestParcelLinkId}:
    put:
      summary: Update Property Interest Reference
      consumes:
        - application/x-www-form-urlencoded
      operationId: propertyInterestUpdateReference
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestParcelLinkId
          in: path
          required: true
          type: integer
          format: int64
        - name: propertyInterestReference
          in: formData
          required: true
          type: string
          maxLength: 20
      responses:
        201:
          description: successful operation
          schema:
            type: object
            properties:
              propertyInterestParcel:
                schema:
                  $ref: "#/definitions/PropertyInterestParcel"
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
  /propertyinterest/v1/unlink/parcel/{propertyInterestParcelLinkId}:
    post:
      summary: Unlink Property Interest from Parcel
      consumes:
        - application/x-www-form-urlencoded
      operationId: propertyInterestUnlinkParcel
      produces:
        - application/json
      parameters:
        - name: Authorization
          in: header
          description: Bearer JWT
          required: true
          type: string
        - name: propertyInterestParcelLinkId
          in: path
          required: true
          type: integer
          format: int64
      responses:
        201:
          description: successful operation
          schema:
            type: object
        400:
          description: "Invalid input provided: <Error Description>"
          schema:
            $ref: "#/definitions/ApiError"
        401:
          description: Unauthorised Access
          schema:
            $ref: "#/definitions/ApiError"
        403:
          description: Forbidden
          schema:
            $ref: "#/definitions/ApiError"
        500:
          description: "Internal SAILIS error <Error ID>"
          schema:
            $ref: "#/definitions/ApiErrorWithId"
definitions:
  PropertyInterest:
    type: object
    properties:
      propertyInterestId:
        type: integer
        format: int64
      name:
        type: string
        maxLength: 50
      piCode:
        type: string
        maxLength: 6
      effectiveFrom:
        type: string
        format: date-time
      effectiveTo:
        type: string
        format: date-time
      created:
        type: string
        format: date-time
  PropertyInterestParcel:
    type: object
    properties:
      propertyInterestParcelId:
        type: integer
        format: int64
      propertyInterestId:
        type: integer
        format: int64
      reference:
        type: string
        maxLength: 20
      created:
        type: string
        format: date-time
      planParcelReference:
        $ref: "#/definitions/PlanParcelReference"
  TitleReference:
    type: object
    properties:
      register:
        type: string
        enum: [CT, CR, CL]
      volume:
        type: integer
        format: int32
        minimum: 5000
      folio:
        type: integer
        format: int32
        maximum: 999
  PlanParcelReference:
    type: object
    properties:
      planType:
        type: string
        enum:
          - D
          - C
          - S
          - F
          - H
          - R
          - T
          - G
      planNumber:
        type: string
        maxLength: 6
      parcelType:
        type: string
        enum:
          - AL
          - AP
          - AR
          - AD
          - AE
          - AV
          - AT
          - AF
          - FL
          - FQ
          - ID
          - IQ
          - FC
          - UC
          - UN
          - SE
          - BL
          - TA
          - AC
          - QP
      parcelNumber:
        type: string
        maxLength: 6
  Address:
    type: object
    properties:
      unitType:
        type: string
